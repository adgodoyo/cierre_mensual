name: Cierre mensual

on:
  schedule:
    - cron: "0 12 5 * *" # Día 5 de cada mes, 7:00 a. m. en Bogotá (UTC-5)
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a cerrar (AAAA-MM). Vacío = último disponible"
        required: false
        default: ""
      aprobado:
        description: "Una persona ya revisó las alertas"
        type: boolean
        default: false
  issues:
    types: [closed]

concurrency:
  group: cierre-mensual
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  cierre:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Revisión requerida:')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Definir mes y aprobación
        id: datos
        env:
          EVENTO: ${{ github.event_name }}
          MES_ENTRADA: ${{ inputs.mes }}
          APROBADO_ENTRADA: ${{ inputs.aprobado }}
          TITULO: ${{ github.event.issue.title }}
        run: |
          MES="$MES_ENTRADA"
          APROBADO="false"
          [ "$APROBADO_ENTRADA" = "true" ] && APROBADO="true"
          if [ "$EVENTO" = "issues" ]; then
            MES="$(printf '%s' "$TITULO" | grep -oE '[0-9]{4}-[0-9]{2}' | head -1)"
            APROBADO="true"
          fi
          if [ -n "$MES" ] && ! printf '%s' "$MES" | grep -qE '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
            echo "Mes inválido" >&2; exit 1
          fi
          [ -n "$MES" ] || MES="$(ls 01_insumos | grep -E '^[0-9]{4}-[0-9]{2}$' | sort | tail -1)"
          echo "mes=$MES" >> "$GITHUB_OUTPUT"
          echo "aprobado=$APROBADO" >> "$GITHUB_OUTPUT"

      - name: Ejecutar el cierre
        env:
          MES: ${{ steps.datos.outputs.mes }}
          APROBADO: ${{ steps.datos.outputs.aprobado }}
        run: |
          if [ "$APROBADO" = "true" ]; then python run_cierre.py --mes "$MES" --aprobado
          else python run_cierre.py --mes "$MES"; fi

      - name: Pruebas antes de publicar
        run: python -m pytest 04_pruebas -q

      - name: Guardar resultados en el historial
        env:
          MES: ${{ steps.datos.outputs.mes }}
        run: |
          git config user.name "agente-cierre"
          git config user.email "agente-cierre@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "cierre $MES: resultados de la rutina"
          git push

      - name: Abrir o cerrar la revisión humana
        env:
          GH_TOKEN: ${{ github.token }}
          MES: ${{ steps.datos.outputs.mes }}
        run: |
          TITULO="Revisión requerida: $MES"
          REQUIERE="$(python -c "import json,os; print(str(json.load(open(f'03_salidas/{os.environ[\"MES\"]}/estado_cierre.json'))['requiere_revision']).lower())")"
          NUMERO="$(gh issue list --state open --search "\"$TITULO\" in:title" --json number,title --jq "map(select(.title == \"$TITULO\")) | .[0].number // empty")"
          if [ "$REQUIERE" = "true" ] && [ -z "$NUMERO" ]; then
            gh issue create --title "$TITULO" --body-file "03_salidas/$MES/revision_requerida.md"
          elif [ "$REQUIERE" = "false" ] && [ -n "$NUMERO" ]; then
            gh issue close "$NUMERO" --comment "Cierre aprobado. Reportes publicados sin marca de borrador."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: publicar
        uses: actions/deploy-pages@v4
