<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre Mensual Andino</title>
<meta name="description" content="Tablero interactivo de un cierre mensual con agentes de IA. Datos simulados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="cabecera">
  <div class="marca">
    <p class="sobre">Agentes de IA para la Función Financiera</p>
    <h1>Concesionario Andino: cierre mensual</h1>
  </div>
  <span class="sello">Datos simulados</span>
</header>
<section class="filtros" aria-label="Filtros globales">
  <label>Concesionario<select id="f-cid"></select></label>
  <label>Sede<select id="f-sede"></select></label>
  <label>Mes<select id="f-mes"></select></label>
  <label>Canal<select id="f-canal"></select></label>
  <label>Línea<select id="f-linea"></select></label>
  <button id="f-limpiar" type="button">Restablecer</button>
</section>
<nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>
<main id="contenido"><div class="cargando" id="cargando">Abriendo la base de datos en su navegador…</div></main>
<footer class="pie">Datos simulados. No corresponden a ninguna empresa real. Construido solo con herramientas gratuitas.</footer>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/tabs_datos.js"></script>
<script src="js/tabs_analisis.js"></script>
<script src="js/tabs_cierre.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
